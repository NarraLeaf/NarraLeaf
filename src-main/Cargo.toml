[package]
name = "narraleaf-runtime"
version = "0.1.0"
authors = ["Nomen (helloyork) helloyork@icloud.com"]
edition = "2024"
description = "NarraLeaf Tauri Runtime Plugin"
license = "MPL-2.0"
repository = "https://github.com/NarraLeaf/NarraLeaf"
keywords = ["tauri", "plugin", "ipc", "sidecar"]
categories = ["api-bindings", "development-tools"]

[dependencies]
tauri = { version = "2.6", features = ["unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full", "net", "io-util", "time"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
windows-sys = { version = "0.60.2", features = ["Win32_System_Pipes", "Win32_Foundation", "Win32_Security"] }
urlencoding = "2.1"

[lib]
name = "narraleaf_host"
path = "src/lib.rs"
crate-type = ["lib"]

[[example]]
name = "demo"
path = "examples/demo.rs"


