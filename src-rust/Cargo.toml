[package]
name = "narraleaf-host"
version = "0.1.0"
authors = ["Nomen (helloyork) helloyork@icloud.com"]
edition = "2024"
description = "NarraLeaf Main Process Service"
license = "MPL-2.0"
repository = "https://github.com/NarraLeaf/NarraLeaf"

[dependencies]
tauri = { version = "2.6", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
once_cell = "1.0"
regex = "1.0"

[features]
default = []
with-tauri = ["tauri"]